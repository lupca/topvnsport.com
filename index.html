<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <!-- Start the catalog reads at HTML parse time instead of after the bundle runs. Same URLs as src/services/sport-api (PMI_PROXY_URL/WMS_PROXY_URL). api/product.ts strips these on product pages. -->
    <link rel="preload" as="fetch" crossorigin data-catalog-preload href="/api/pmi/public/voma-categories" />
    <link rel="preload" as="fetch" crossorigin data-catalog-preload href="/api/wms/public/stock" />
    <link rel="preload" as="fetch" crossorigin data-catalog-preload href="/api/pmi/public/products?page=1&amp;limit=100" />
    <!-- Fonts as a parallel <link> (was a CSS @import, which chained Google CSS behind the bundle CSS before the first paint). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,500;1,600;1,700&amp;family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,500;1,600;1,700;1,800;1,900&amp;family=JetBrains+Mono:wght@400;500;700&amp;display=swap" />
    <style>
      /* Static first paint before any JS: grey blocks sized like the product grid; hidden once React fills #root. */
      /* match Tailwind preflight so applying the deferred bundle CSS moves nothing */
      body{margin:0}#boot,#boot *{box-sizing:border-box}
      #boot{background:#f9fafb;min-height:100svh;padding:72px 16px 0}
      #boot p{margin:0 0 16px;text-align:center;font:900 20px/1 system-ui,sans-serif;letter-spacing:.06em;text-transform:uppercase;color:#111827}
      #boot div{border-radius:12px;background:#e5e7eb}
      #boot .g{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;background:none;border-radius:0}
      #boot .g div{aspect-ratio:1/1.35}
      @media(min-width:768px){#boot{padding:96px 24px 0}#boot .g{grid-template-columns:repeat(4,1fr);gap:24px;max-width:1280px;margin:0 auto}}
      #root:not(:empty)~#boot{display:none}
      /* api/page.ts server text (home, catalog) until React replaces #root; the bundle CSS is deferred, so it is styled here. */
      #ssr{box-sizing:border-box;min-height:100svh;max-width:1280px;margin:0 auto;padding:16px;background:#f9fafb;color:#111827;font:15px/1.5 system-ui,sans-serif}
      #ssr h1{margin:8px 0;font:900 22px/1.2 system-ui,sans-serif;text-transform:uppercase}
      #ssr p{margin:0 0 16px;color:#4b5563}
      #ssr .ssr-hero{display:block;width:100%;height:290px;object-fit:cover;margin:0 0 16px;background:#e5e7eb}
      #ssr ul{list-style:none;margin:0 0 16px;padding:0}
      #ssr li{padding:8px 0;border-bottom:1px solid #e5e7eb}
      #ssr nav li{display:inline-block;margin:0 16px 0 0;border:0}
      #ssr a{color:#111827}
      @media(min-width:768px){#ssr{padding:24px}#ssr .ssr-hero{height:auto;aspect-ratio:1440/520;max-height:560px}}
    </style>
    <!-- vite.config.ts writes HOME_SEO.title (src/config/seo.ts) here at build time. -->
    <title>Top VN Sport</title>
  </head>
  <body>
    <div id="root"></div>
    <div id="boot" aria-hidden="true"><p>TopVNSport</p><div class="g"><div></div><div></div><div></div><div></div><div></div><div></div><div></div><div></div></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
