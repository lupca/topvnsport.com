name: Synthetic public API check

# STOR-139: every 5 minutes, read-only GETs of the 3 public API routes on production.
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: synthetic-public-api
  cancel-in-progress: false

jobs:
  check:
    name: GET public API routes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run synthetic check
        run: bash scripts/synthetic-check.sh

      - name: Upload results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-results
          path: synthetic-results.txt
          retention-days: 7
